name: Build Windows executable

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag
        required: true
        default: windows-v1

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name SamXpress-Fleet `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --add-data "data.json;." `
            app.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SamXpress-Fleet-Windows
          path: dist/SamXpress-Fleet.exe

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "${{ inputs.release_tag }}" "dist/SamXpress-Fleet.exe" `
            --title "SamXpress Fleet Windows" `
            --generate-notes
